name: backend-ci-cd

  on:
    workflow_dispatch:
    pull_request:
      branches: [develop, main]
    push:
      branches: [develop, main]

  env:
    DEPLOY_PATH: /home/ubuntu/tobehealthy/workspace/backend
    COMPOSE_PATH: /home/ubuntu/tobehealthy/workspace

  jobs:
    ci:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "17"
            cache: gradle
        - run: ./gradlew test --no-daemon
        - run: docker build -t tobehealthy-backend-ci .

    deploy:
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      needs: ci
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: |
            install -m 700 -d ~/.ssh
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            PORT="${{ secrets.DEPLOY_PORT || 22 }}"
            ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
        - run: |
            PORT="${{ secrets.DEPLOY_PORT || 22 }}"
            rsync -az --delete --exclude '.git/' --exclude 'build/' --exclude '.env' \
              -e "ssh -p $PORT" ./ \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/"
        - run: |
            PORT="${{ secrets.DEPLOY_PORT || 22 }}"
            ssh -p "$PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '${COMPOSE_PATH}' && docker compose build backend && docker compose up -d backend"